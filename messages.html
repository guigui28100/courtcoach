<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Messages – CourtCoach</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#B8471F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="messages">
  <main id="contenu">
    <section class="app-head">
      <div class="wrap">
        <p class="eyebrow eyebrow--clay">Messages</p>
        <h1 id="titre-page">Échanger avec mon coach</h1>
        <p>Texte, photos et vidéos : une discussion par vidéo, et une discussion générale.</p>
      </div>
    </section>

    <div class="wrap app-main">
      <div class="chat" id="chat" data-view="list">
        <nav class="chat__list" aria-label="Discussions" id="threads"></nav>

        <section class="chat__main" aria-labelledby="thread-title">
          <div class="chat__head">
            <div>
              <a class="only-mobile" href="messages.html" style="min-height:44px;align-items:center;font-weight:700">← Toutes les discussions</a>
              <h2 id="thread-title"></h2>
            </div>
            <div class="btn-row" id="thread-actions"></div>
          </div>
          <div class="chat__log" id="log" role="log" aria-live="polite" aria-label="Messages de la discussion" tabindex="0"></div>
          <form class="composer" id="composer" novalidate>
            <label class="sr-only" for="texte">Ton message</label>
            <textarea id="texte" placeholder="Écris ton message…"></textarea>
            <div class="composer__files" id="pending" aria-live="polite"></div>
            <div class="composer__actions">
              <label class="btn btn--small btn--outline" for="pieces" style="cursor:pointer">
                <span aria-hidden="true">📎</span>&nbsp;Photo ou vidéo
              </label>
              <input class="sr-only" id="pieces" type="file" accept="image/*,video/*" multiple>
              <button class="btn btn--clay" type="submit">Envoyer</button>
            </div>
            <p class="status-line" role="status" id="msg-status"></p>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="store.js"></script>
  <script src="layout.js"></script>
  <script src="messages.js"></script>
</body>
</html>
