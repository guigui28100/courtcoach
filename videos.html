<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mes vidéos – CourtCoach</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#B8471F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/archivo-latin-400-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="videos">
  <main id="contenu">
    <section class="app-head">
      <div class="wrap">
        <p class="eyebrow eyebrow--clay" id="eyebrow">Mes vidéos</p>
        <h1 id="titre">Mes vidéos</h1>
        <p id="sous-titre"></p>
      </div>
    </section>

    <div class="wrap app-main">
      <div class="example-box">
        <p><strong>Pas de vidéo sous la main&nbsp;?</strong> Ajoute deux petites vidéos d'exemple pour tester l'application.</p>
        <button class="btn btn--small btn--ink" type="button" data-examples="exemples-status">Ajouter des vidéos d'exemple</button>
        <p class="status-line" role="status" id="exemples-status"></p>
      </div>

      <section id="envoyer" aria-labelledby="envoi-titre">
        <h2 id="envoi-titre">Envoyer une vidéo</h2>
        <form class="form-section" id="form-upload" novalidate>
          <div class="field">
            <label for="fichier" id="fichier-label">Ma vidéo</label>
            <input id="fichier" name="fichier" type="file" accept="video/*" aria-describedby="fichier-aide">
            <small id="fichier-aide">Filme-toi de profil ou de face, en entier, avec une bonne lumière. 5 à 20 secondes suffisent.</small>
          </div>
          <video id="apercu" class="preview-video" controls playsinline muted hidden></video>

          <!-- Coach : cette vidéo est un modèle, ou celle d'un élève (par exemple filmée pendant un cours) -->
          <fieldset class="field" id="champ-destinataire" hidden>
            <legend>Cette vidéo est…</legend>
            <div class="chips">
              <label><input type="radio" name="destinataire" value="eleve"> La vidéo d'un de mes élèves</label>
              <label><input type="radio" name="destinataire" value="reference"> Un modèle de référence</label>
            </div>
            <div id="champ-eleve" hidden style="margin-top: 8px">
              <label for="eleve-id" style="font-weight:700">Quel élève&nbsp;?</label>
              <select id="eleve-id" name="eleve"></select>
            </div>
            <small id="destinataire-aide"></small>
          </fieldset>
          <div class="fields-2">
            <div class="field">
              <label for="titre-video">Titre (facultatif)</label>
              <input id="titre-video" name="titre" type="text" maxlength="80" placeholder="Ex. : Coup droit du mardi">
            </div>
            <div class="field">
              <label for="coup">Quel coup ?</label>
              <select id="coup" name="coup"></select>
            </div>
          </div>
          <div class="field" id="champ-question">
            <label for="question">Ce que je voudrais améliorer</label>
            <textarea id="question" name="question" placeholder="Je n'arrive pas à être régulier sur mon revers…"></textarea>
          </div>
          <button class="btn btn--clay" type="submit" id="btn-envoyer">Envoyer la vidéo</button>
          <p class="status-line" role="status" id="upload-status"></p>
        </form>
      </section>

      <section aria-labelledby="liste-titre">
        <h2 id="liste-titre">Ma bibliothèque</h2>
        <div class="tabs-row" id="filtres" role="group" aria-label="Filtrer les vidéos" hidden></div>
        <p class="hint" id="espace-stockage" style="margin-top: var(--s2)"></p>
        <div class="video-grid" id="liste"></div>
      </section>
    </div>
  </main>

  <script src="store.js"></script>
  <script src="competition.js"></script>
  <script src="layout.js"></script>
  <script src="videos.js"></script>
  <script src="exemples.js"></script>
</body>
</html>
