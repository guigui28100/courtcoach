<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon suivi – CourtCoach</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#B8471F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="suivi.css">
</head>
<body data-page="mon-suivi">
  <main id="contenu">
    <section class="app-head app-head--comp">
      <div class="wrap">
        <p class="eyebrow eyebrow--clay">Mon suivi</p>
        <h1 id="nom">Mon suivi</h1>
        <p id="intro">Mes objectifs, mes évaluations et mes bulletins.</p>
        <div class="kpis" id="kpis"></div>
      </div>
    </section>
    <div class="wrap app-main">
      <div id="vide" hidden></div>
      <div id="contenu-suivi" hidden>
        <div class="tabs-bar" role="tablist" aria-label="Sections de mon suivi" id="onglets"></div>
        <section class="tab-panel" id="p-objectifs" role="tabpanel" aria-labelledby="t-objectifs" hidden></section>
        <section class="tab-panel" id="p-evaluations" role="tabpanel" aria-labelledby="t-evaluations" hidden></section>
        <section class="tab-panel" id="p-analyses" role="tabpanel" aria-labelledby="t-analyses" hidden></section>
        <section class="tab-panel" id="p-bulletins" role="tabpanel" aria-labelledby="t-bulletins" hidden></section>
      </div>
    </div>
  </main>

  <script src="store.js"></script>
  <script src="competition.js"></script>
  <script src="suivi-ui.js"></script>
  <script src="layout.js"></script>
  <script src="mon-suivi.js"></script>
</body>
</html>
