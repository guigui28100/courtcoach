<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dossier joueur – CourtCoach</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#B8471F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="suivi.css">
</head>
<body data-page="joueur">
  <main id="contenu">
    <section class="app-head app-head--comp">
      <div class="wrap">
        <a href="suivi.html" class="back-link back-link--dark">← Tous mes joueurs</a>
        <div class="player-head">
          <span id="avatar"></span>
          <div class="player-head__text">
            <p class="eyebrow eyebrow--clay">Dossier du joueur</p>
            <h1 id="nom"></h1>
            <div class="chips-info" id="infos"></div>
          </div>
          <a class="btn btn--ball btn--small player-head__cta" id="btn-bulletin" href="bulletin.html">Bulletin du trimestre</a>
        </div>
        <div class="kpis" id="kpis"></div>
      </div>
    </section>

    <div class="wrap app-main">
      <div class="tabs-bar" role="tablist" aria-label="Sections du dossier" id="onglets"></div>
      <section class="tab-panel" id="p-profil" role="tabpanel" aria-labelledby="t-profil" hidden></section>
      <section class="tab-panel" id="p-objectifs" role="tabpanel" aria-labelledby="t-objectifs" hidden></section>
      <section class="tab-panel" id="p-evaluations" role="tabpanel" aria-labelledby="t-evaluations" hidden></section>
      <section class="tab-panel" id="p-videos" role="tabpanel" aria-labelledby="t-videos" hidden></section>
      <section class="tab-panel" id="p-bulletins" role="tabpanel" aria-labelledby="t-bulletins" hidden></section>
    </div>
  </main>

  <script src="store.js"></script>
  <script src="competition.js"></script>
  <script src="suivi-ui.js"></script>
  <script src="layout.js"></script>
  <script src="joueur.js"></script>
</body>
</html>
